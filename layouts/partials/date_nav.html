<div class="bg-white/50 dark:bg-slate-900/50 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between gap-4 relative">
        
        <!-- Main Controls (Left/Center) -->
        <div class="flex items-center gap-3">
            <!-- Date Selector -->
            <div id="date-selector" class="flex items-center gap-3 px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:border-ksu dark:hover:border-blue-500 transition-all cursor-pointer shadow-sm group">
                <i class="bi bi-calendar3 text-ksu dark:text-blue-400 group-hover:scale-110 transition-transform"></i>
                <span id="current-date-display" class="font-bold text-sm md:text-base">----年--月--日 (ー)</span>
                <input type="text" id="datepicker-input" class="datepicker-anchor">
            </div>

            <!-- Nav Buttons -->
            <!-- スマートフォンの幅では隠し、画面の下の操作バー（partials/action_bar.html）に同じボタンを出す -->
            <div class="hidden md:flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-lg shadow-inner">
                <button type="button" data-action="prev-day" class="px-3 py-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-md transition-all text-xs font-bold text-slate-600 dark:text-slate-300">
                    <i class="bi bi-chevron-left"></i> 前日
                </button>
                <button type="button" data-action="today" class="px-4 py-1.5 bg-ksu text-white rounded-md shadow-md text-xs font-black mx-1 transition-transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:scale-100">
                    今日
                </button>
                <button type="button" data-action="next-day" class="px-3 py-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-md transition-all text-xs font-bold text-slate-600 dark:text-slate-300">
                    翌日 <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- Info Area (Right) -->
        <!-- 情報（取得元）のボタンは、データについての説明として提供範囲と最終更新の隣に置く -->
        <div class="flex items-center justify-end gap-2">
            <div class="text-right flex flex-col items-end gap-1">
                <div id="header-data-range" class="text-[10px] md:text-xs font-medium text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded"></div>
                <div id="status-info" class="text-[10px] text-slate-400 dark:text-slate-500 italic"></div>
            </div>
            <button type="button" data-modal-open="statusModal" class="p-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-all text-slate-600 dark:text-slate-400 hover:text-ksu dark:hover:text-blue-400 shrink-0" title="情報（取得元）" aria-label="情報（取得元）">
                <i class="bi bi-info-circle"></i>
            </button>
        </div>
    </div>
</div>
